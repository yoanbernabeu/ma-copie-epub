name: La génération échoue
description: L'extension s'arrête avec une erreur ou produit un fichier incomplet.
labels: ["bug", "génération"]
body:
  - type: markdown
    attributes:
      value: |
        **Ne collez aucun extrait du programme** (texte, sommaire, capture du contenu). Décrivez le problème et donnez l'adresse de la page concernée.
  - type: input
    id: version
    attributes:
      label: Version de l'extension
      description: Indiquée en bas de la page de génération (par exemple 0.1.0).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et système
      placeholder: Chrome 131 sur Windows 11
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message affiché
      description: Recopiez le message d'erreur de la page de génération.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Précisions
      description: À quelle page la génération s'est-elle arrêtée ? Le problème se répète-t-il ?
