name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci

      - name: Tests (pages synthétiques)
        run: npm test

      - name: Install epubcheck
        run: sudo apt-get update && sudo apt-get install -y epubcheck

      - name: Validate fixture EPUB with epubcheck
        run: npm run fixture-epub && epubcheck dist/fixture.epub

      - name: Package extension
        id: zip
        run: |
          npm run package
          echo "sha256=$(sha256sum dist/ma-copie-epub.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ma-copie-epub.zip
          body: |
            Empreinte SHA-256 de `ma-copie-epub.zip` : `${{ steps.zip.outputs.sha256 }}`

            Guide d'installation : voir le site du projet.

      # ---- Site : construit à chaque push, publié sur GitHub Pages seulement pour un tag
      - id: pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # L'empreinte n'est affichée que pour une version publiée (tag)
          ZIP_SHA256: ${{ startsWith(github.ref, 'refs/tags/v') && steps.zip.outputs.sha256 || '' }}
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site/dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
